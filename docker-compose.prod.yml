# Продакшен с HTTPS. Отдельный файл, а не наслоение на docker-compose.yml:
# так конфиги Nginx не конфликтуют.
#
#   cp .env.example .env   и заполнить DOMAIN, CERTBOT_EMAIL, NEXT_PUBLIC_SITE_URL
#
# На сервере (образ собран в GitHub Actions):
#   docker compose -f docker-compose.prod.yml pull web
#   docker compose -f docker-compose.prod.yml up -d
#
# Локально, если хочется собрать самому:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Первый сертификат выпускается разово, инструкция в README.
services:
  web:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?укажи адрес сайта в .env}
    # Готовый образ из GHCR: на сервере ничего не собирается,
    # поэтому хватает самого дешёвого тарифа с 1 ГБ памяти
    image: ${WEB_IMAGE:-ghcr.io/romchill/romchikportfolio:latest}
    container_name: portfolio-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?укажи адрес сайта в .env}
    expose:
      - "3000"
    read_only: true
    tmpfs:
      # Файловая система контейнера только на чтение — под запись даём два каталога
      - /tmp
      - /app/.next/cache
    security_opt:
      - no-new-privileges:true
    networks:
      - edge

  nginx:
    image: nginx:1.27-alpine
    container_name: portfolio-nginx
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?укажи домен в .env}
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx/conf.d
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/templates:/etc/nginx/templates:ro
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    networks:
      - edge

  # Проверяет сертификат дважды в сутки и продлевает, когда подходит срок
  certbot:
    image: certbot/certbot:latest
    container_name: portfolio-certbot
    restart: unless-stopped
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: /bin/sh
    command: -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'

networks:
  edge:

volumes:
  certbot-conf:
  certbot-www:
