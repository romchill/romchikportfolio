# Собирает образ в облаке GitHub и раскатывает его на сервер.
#
# Сборка тяжёлая (next build съедает под 2 ГБ памяти), поэтому она
# происходит здесь, а не на VPS — так хватает самого дешёвого тарифа.
#
# Что нужно настроить в репозитории:
#   Variables → SITE_URL        https://твой-домен
#   Variables → DEPLOY_ENABLED  true   (пока не задано — деплой пропускается)
#   Variables → DEPLOY_PATH     /opt/portfolio  (необязательно)
#   Secrets   → SSH_HOST, SSH_USER, SSH_KEY
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  image:
    name: Собрать и опубликовать образ
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Войти в GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Собрать и запушить
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.SITE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Выкатить на сервер
    needs: image
    # Пока переменная не выставлена, шаг тихо пропускается —
    # чтобы пуши не падали до того, как сервер куплен
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Обновить контейнеры по SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd ${{ vars.DEPLOY_PATH || '/opt/portfolio' }}
            git pull --ff-only
            docker compose -f docker-compose.prod.yml pull web
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
