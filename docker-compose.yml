# Продакшен: Next-сервер за Nginx.
#   docker compose up -d --build
services:
  web:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost}
    image: romchik-portfolio:latest
    container_name: portfolio-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost}
    expose:
      - "3000"
    networks:
      - edge

  nginx:
    image: nginx:1.27-alpine
    container_name: portfolio-nginx
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./infra/nginx/http.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - edge

networks:
  edge:
